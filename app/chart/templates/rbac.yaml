apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: diiage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backend-pods-cluster
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backend-pods-binding
subjects:
- kind: ServiceAccount
  name: backend-sa
  namespace: diiage
roleRef:
  kind: ClusterRole
  name: backend-pods-cluster
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-configmaps
  namespace: diiage
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-configmaps-binding
  namespace: diiage
subjects:
- kind: ServiceAccount
  name: backend-sa
  namespace: diiage
roleRef:
  kind: Role
  name: backend-configmaps
  apiGroup: rbac.authorization.k8s.io
